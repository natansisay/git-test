# Cloudflare Worker – שכבה חינמית. פריסה: npx wrangler deploy
name = "erdata-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# הכתובת של האתר (GitHub Pages). אפשר כמה, מופרדות בפסיק.
ALLOWED_ORIGINS = "https://USERNAME.github.io"
AZURE_SPEECH_REGION = "westeurope"
# GEMINI_MODEL = "gemini-2.5-flash"
# AZURE_VOICE = "am-ET-AmehaNeural"

# סודות – לא כותבים כאן! מגדירים כך:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put AZURE_SPEECH_KEY
#   npx wrangler secret put SIGNING_SECRET     (סתם מחרוזת ארוכה ואקראית)
